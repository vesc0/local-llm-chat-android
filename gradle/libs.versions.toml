[versions]
agp = "9.3.2"
kotlin = "2.4.20"
composeBom = "2026.02.00"
coroutines = "1.11.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.11.0" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.9.4" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.9.4" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.6.3" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
litertlm = { module = "com.google.ai.edge.litertlm:litertlm-android", version = "0.17.1" }
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version = "0.45.0" }
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version = "1.0.0-beta4" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
pdfbox = { module = "com.tom-roush:pdfbox-android", version = "2.0.27.0" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
